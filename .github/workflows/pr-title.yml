name: PR Title

# The PR title becomes the squash commit's title. yggdrasil's pr-title module
# refuses a title that isn't `type(scope): summary`, so the history reads the
# same as every other repo's. Renovate's titles (`chore(deps): ...`) already
# pass.
#
# `edited` is in the list so a title fix reruns the check, and `synchronize`
# because a check reports against the head commit.
#
# Branch protection requires `PR Title / PR Title` (this job's name, then the
# module's); renaming either strands PRs on a check that never reports.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions: {}

jobs:
  title:
    name: PR Title
    uses: zimmertr/yggdrasil/.github/workflows/pr-title.yml@f805e7b874e54e661d8dc8ad528883228bfc567b # v1.2.9
    permissions:
      pull-requests: read # the module reads the PR's title
