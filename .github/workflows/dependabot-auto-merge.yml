name: Dependabot auto-merge

# Patch and minor Dependabot updates merge themselves once main's required
# checks pass. Majors wait for TJ. yggdrasil's auto-merge module.
#
# The merge is armed with AUTO_MERGE_PAT, a Dependabot secret, since a run
# Dependabot starts can't read Actions secrets. This repo has no workflow that
# runs on push, so no release depends on which token merges.
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  auto-merge:
    name: Dependabot auto-merge
    uses: zimmertr/yggdrasil/.github/workflows/auto-merge.yml@667ac9372b2be9ed09b67c2da14f6fbd93e2b1b3 # v1.0.0
    permissions:
      pull-requests: write # the comment
    secrets:
      merge-token: ${{ secrets.AUTO_MERGE_PAT }}
